name: DHL Automated Background Sync

on:
  schedule:
    # Hourly 06:00-20:00 UTC, Monday-Saturday
    - cron: '0 6-20 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: write   # allows the Action to push the updated cache

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run DHL sync
        env:
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}
        run: python sync_dhl.py

      - name: Commit & push updated cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add printflo_tracking_cache.json
          git commit -m "Auto-update DHL tracking statuses [skip ci]" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
